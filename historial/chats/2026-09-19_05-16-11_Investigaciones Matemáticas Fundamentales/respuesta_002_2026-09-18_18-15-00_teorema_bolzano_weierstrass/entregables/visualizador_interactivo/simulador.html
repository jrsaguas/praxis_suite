<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teorema de Bolzano-Weierstrass en R^n · Sucesiones y Compacidad de Bolzano-Weierstrass</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root { --bg: #0f172a; --card: #1e293b; --ink: #f8fafc; --muted: #94a3b8; --brand: #38bdf8; --line: #334155; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'IBM Plex Sans', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; }
.container { width: 100%; max-width: 900px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.header { padding: 18px 24px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; }
.header h1 { margin: 0; font-size: 19px; color: var(--brand); }
.canvas-wrap { width: 100%; height: 480px; background: #090d16; }
canvas { width: 100%; height: 100%; display: block; }
.controls { padding: 18px 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; background: rgba(15,23,42,0.6); }
.control-group { display: flex; flex-direction: column; gap: 6px; }
.control-group label { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; }
.control-group input[type=range] { accent-color: var(--brand); }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>Teorema de Bolzano-Weierstrass en R^n</h1>
    <span style="font-family:'IBM Plex Mono',monospace;color:var(--brand);font-size:12px;">x_k = (-1)^k (1 - 1/k) + cos(k/2) / 2</span>
  </div>
  <div class="canvas-wrap"><canvas id="simCanvas"></canvas></div>
  <div class="controls">
    <div class="control-group">
      <label>Número de términos N: <b id="val_N">80</b></label>
      <input type="range" id="termsN" min="10" max="250" step="5" value="80">
    </div>
    <div class="control-group">
      <label>Radio de vecindad ε: <b id="val_eps">0.20</b></label>
      <input type="range" id="epsRange" min="0.05" max="0.60" step="0.01" value="0.20">
    </div>
  </div>
</div>
<script>
(() => {
  const canvas = document.getElementById('simCanvas');
  const ctx = canvas.getContext('2d');
  let width, height, cx, cy;
  let N = 80, eps = 0.20;

  function resize() {
    width = canvas.width = canvas.parentElement.clientWidth;
    height = canvas.height = canvas.parentElement.clientHeight;
    cx = 60; cy = height / 2;
  }
  window.addEventListener('resize', resize);
  resize();

  function seq(k) {
    return Math.pow(-1, k) * (1 - 1 / k) + 0.4 * Math.cos(k / 2);
  }

  function render() {
    ctx.fillStyle = '#090d16'; ctx.fillRect(0, 0, width, height);

    // Ejes
    ctx.strokeStyle = '#334155'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(width - 20, cy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx, 20); ctx.lineTo(cx, height - 20); ctx.stroke();

    const scaleY = (height / 2) * 0.5;
    const dx = (width - cx - 40) / N;

    // Banda de acumulacion
    const [acc1, acc2] = [1.0, -1.0];
    ctx.fillStyle = 'rgba(56, 189, 248, 0.08)';
    ctx.fillRect(cx, cy - (acc1 + eps) * scaleY, width - cx, 2 * eps * scaleY);
    ctx.fillRect(cx, cy - (acc2 + eps) * scaleY, width - cx, 2 * eps * scaleY);

    // Puntos de la sucesion
    for (let k = 1; k <= N; k++) {
      const val = seq(k);
      const px = cx + k * dx;
      const py = cy - val * scaleY;

      ctx.fillStyle = (Math.abs(val - acc1) <= eps || Math.abs(val - acc2) <= eps) ? '#f43f5e' : '#38bdf8';
      ctx.beginPath(); ctx.arc(px, py, 3.5, 0, 2 * Math.PI); ctx.fill();

      // Proyección vertical a la recta real a la izquierda
      ctx.fillStyle = 'rgba(248, 250, 252, 0.4)';
      ctx.fillRect(cx - 8, py - 1, 6, 2);
    }

    requestAnimationFrame(render);
  }

  document.getElementById('termsN').addEventListener('input', (e) => {
    N = parseInt(e.target.value);
    document.getElementById('val_N').innerText = N;
  });
  document.getElementById('epsRange').addEventListener('input', (e) => {
    eps = parseFloat(e.target.value);
    document.getElementById('val_eps').innerText = eps.toFixed(2);
  });

  render();
})();
</script>
</body>
</html>
